name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android Platform Folders
        run: |
          flutter create --org com.health.expense --project-name health_expense_tracker temp_project
          mv temp_project/android flutter_project/android
          rm -rf temp_project

      - name: Install dependencies
        working-directory: ./flutter_project
        run: flutter pub get

      - name: Build APK
        working-directory: ./flutter_project
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: flutter_project/build/app/outputs/flutter-apk/app-release.apk
